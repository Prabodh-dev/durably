services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: durably
      POSTGRES_USER: durably
      POSTGRES_PASSWORD: durably
    ports:
      - '15432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U durably -d durably']
      interval: 3s
      timeout: 3s
      retries: 20

  server:
    build:
      context: .
      target: runtime
    environment:
      DATABASE_URL: postgres://durably:durably@postgres:5432/durably
      PORT: '3000'
    command: ['node', 'packages/server/dist/main.js']
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - '3000:3000'

  worker:
    build:
      context: .
      target: runtime
    environment:
      DATABASE_URL: postgres://durably:durably@postgres:5432/durably
      DURABLY_WORKER_LEASE_MS: '4000'
      DURABLY_WORKER_REAPER_INTERVAL_MS: '1000'
      DURABLY_WORKER_LEADER_INTERVAL_MS: '1000'
      DURABLY_WORKER_METRICS_PORT: '9090'
    command: ['node', 'packages/worker/dist/main.js']
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - '9090'

  prometheus:
    image: prom/prometheus:v2.54.1
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.retention.time=6h'
    volumes:
      - ./ops/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - server
      - worker
    ports:
      - '9095:9090'

  grafana:
    image: grafana/grafana:11.2.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: 'true'
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: 'true'
    volumes:
      - ./ops/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./ops/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
    ports:
      - '3001:3000'
